services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      - ollama
      - searxng
    volumes:
      - openwebui_data:/app/backend/data
    network_mode: "host"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 3G
        reservations:
          memory: 512M
    environment:
      - PORT=3000
      - OLLAMA_BASE_URL=http://localhost:11434
      - ENABLE_RAG_WEB_SEARCH=true
      - RAG_WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://localhost:8888/search?q=<query>
      # --- 3-MINUTE TIMEOUT CONFIGURATION ---
      - AIOHTTP_CLIENT_TIMEOUT=600
      - AIOHTTP_CLIENT_TIMEOUT_TOOL_SERVER=600
      - MCP_INITIALIZE_TIMEOUT=600

  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    volumes:
      - ./searxng:/etc/searxng
    ports:
      - "8888:8080"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M

  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama-vulkan
    container_name: ollama
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd
    group_add:
      - "44"
      - "992"
    environment:
      - OLLAMA_NUM_THREADS=8
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_VULKAN=1
      - OLLAMA_IGPU_ENABLE=1
      - OLLAMA_LLM_LIBRARY=vulkan
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - OLLAMA_CONTEXT_LENGTH=4096
      - GGML_VK_VISIBLE_DEVICES=0
      - OLLAMA_KEEP_ALIVE=10m
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        limits:
          cpus: "8.0"
          memory: 14G
        reservations:
          cpus: "4.0"
          memory: 8G

volumes:
  openwebui_data:
  ollama_data:
